<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapcode 3D Brag</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--fond:oklch(0.19 0.045 262);--encre:oklch(0.96 0.012 262);--encre2:oklch(0.77 0.045 262);--cobalt:oklch(0.52 0.26 268);--jaune:oklch(0.87 0.17 88)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
#ecran{position:fixed;inset:0;display:grid;place-items:center}
#scene{position:relative;width:1920px;height:1080px;background:var(--fond);color:var(--encre);font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden;transform-origin:center;flex:none}
.titre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .6s;pointer-events:none;padding:0 160px}
.titre.on{opacity:1}
.titre h1{font:400 150px/1 "Young Serif",Georgia,serif;letter-spacing:-.01em}
.titre p{font-size:48px;color:var(--encre2);margin-top:36px;max-width:1300px;line-height:1.3}
.titre .trait{width:0;height:6px;background:var(--cobalt);margin-top:40px;transition:width 1s ease-out .3s}
.titre.on .trait{width:420px}
#appwrap{position:absolute;left:50%;top:50%;width:1400px;height:900px;border-radius:24px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.7);border:2px solid oklch(0.38 0.07 262);transform:translate(-50%,-50%) translateY(1200px) scale(1);transition:transform 1.1s cubic-bezier(.2,.8,.2,1);transform-origin:center}
#app{width:1400px;height:900px;border:0;background:var(--fond);display:block}
#curseur{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);border:4px solid var(--cobalt);box-shadow:0 0 0 14px rgba(99,82,255,.25);left:0;top:0;opacity:0;transition:left .8s cubic-bezier(.4,0,.2,1),top .8s cubic-bezier(.4,0,.2,1),opacity .3s,transform .15s;z-index:5}
#curseur.clic{transform:scale(.7)}
#legende{position:absolute;left:0;right:0;bottom:50px;text-align:center;font:400 54px "Young Serif",Georgia,serif;opacity:0;transition:opacity .5s;text-shadow:0 4px 20px rgba(0,0,0,.8)}
#legende.on{opacity:1}
#barre{position:absolute;left:0;bottom:0;height:8px;background:var(--cobalt);width:0}
</style>
</head>
<body>
<div id="ecran">
<div id="scene">
  <div class="titre" id="t1"><h1>Snapcode 3D</h1><div class="trait"></div><p>Dépose une capture 3D. Récupère du code Three.js prêt à déployer.</p></div>
  <div id="appwrap"><iframe id="app" src="app.html" title="Snapcode 3D"></iframe></div>
  <div id="curseur"></div>
  <div id="legende"></div>
  <div class="titre" id="t2"><h1>Snapcode 3D</h1><div class="trait"></div><p>Three.js · Babylon.js · PlayCanvas<br>Du code 3D prêt à copier, envoyer ou télécharger.</p></div>
  <div id="barre"></div>
</div>
</div>
<script>
var D=20000, sc=document.getElementById("scene"), wrap=document.getElementById("appwrap"),
cur=document.getElementById("curseur"), leg=document.getElementById("legende"),
t1=document.getElementById("t1"), t2=document.getElementById("t2"), barre=document.getElementById("barre"),
frame=document.getElementById("app");
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);sc.style.transform="scale("+s+")"}
addEventListener("resize",fit);fit();

function cibler(sel){
  try{
    var el=frame.contentDocument.querySelector(sel);
    var r=el.getBoundingClientRect(), w=wrap.getBoundingClientRect(), s=w.width/1400, k=parseFloat(sc.style.transform.replace(/[^0-9.]/g,""))||1;
    var f=frame.getBoundingClientRect();
    return {x:(f.left-sc.getBoundingClientRect().left)/k+(r.left+r.width/2)*s-20, y:(f.top-sc.getBoundingClientRect().top)/k+(r.top+r.height/2)*s-20, el:el};
  }catch(e){return null}
}
function clic(sel){
  var c=cibler(sel); if(!c)return;
  cur.style.opacity=1; cur.style.left=c.x+"px"; cur.style.top=c.y+"px";
  setTimeout(function(){cur.classList.add("clic");c.el.click();setTimeout(function(){cur.classList.remove("clic")},180)},850);
}
function texte(s){leg.textContent=s;leg.classList.add("on")}
function cacher(){leg.classList.remove("on")}

var etapes=[
 [0,    function(){t1.classList.add("on")}],
 [2800, function(){t1.classList.remove("on");wrap.style.transform="translate(-50%,-50%) translateY(0) scale(1)"}],
 [4200, function(){texte("Dépose une capture 3D")}],
 [6000, function(){cacher();clic('[data-format="babylon"]')}],
 [8200, function(){clic('[data-format="playcanvas"]')}],
 [10400,function(){clic('[data-format="threejs"]')}],
 [11800,function(){cur.style.opacity=0;wrap.style.transform="translate(-50%,-50%) scale(1.25) translate(-130px,0)";texte("Le code 3D, prêt à déployer")}],
 [16000,function(){cacher();wrap.style.transform="translate(-50%,-50%) translateY(1200px) scale(1)"}],
 [16800,function(){t2.classList.add("on")}]
];
var t0,fait;
function boucle(){
  var t=performance.now()-t0;
  while(fait<etapes.length&&t>=etapes[fait][0]){etapes[fait][1]();fait++}
  barre.style.width=Math.min(100,t/D*100)+"%";
  if(t>=D){reset();return}
  requestAnimationFrame(boucle)
}
function reset(){
  t1.classList.remove("on");t2.classList.remove("on");cacher();cur.style.opacity=0;
  wrap.style.transition="none";wrap.style.transform="translate(-50%,-50%) translateY(1200px) scale(1)";
  void wrap.offsetWidth;wrap.style.transition="";
  setTimeout(demarrer,600)
}
function demarrer(){t0=performance.now();fait=0;requestAnimationFrame(boucle)}
frame.addEventListener("load",function(){setTimeout(demarrer,800)});
</script>
</body>
</html>
