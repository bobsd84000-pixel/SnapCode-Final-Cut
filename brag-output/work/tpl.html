<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bijoux Argent et Rubis</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--fond:#14101c;--encre:#f6f1e8;--encre2:#b9b0c4;--or:#deaa3c;--rubis:#b3122b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
#ecran{position:fixed;inset:0;overflow:hidden}
#scene{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:radial-gradient(ellipse at 50% 40%,#2a2036 0%,var(--fond) 70%);color:var(--encre);font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden;transform-origin:center;flex:none}
.titre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .9s;pointer-events:none;padding:0 160px}
.titre.on{opacity:1}
.titre h1{font:400 150px/1.05 "Young Serif",Georgia,serif}
.titre p{font-size:46px;color:var(--encre2);margin-top:34px;line-height:1.3}
.trait{width:0;height:5px;background:var(--or);margin-top:40px;transition:width 1.2s ease-out .4s}
.on .trait{width:380px}
.photo{position:absolute;top:50%;overflow:hidden;border-radius:18px;box-shadow:0 40px 120px rgba(0,0,0,.75),0 0 0 2px rgba(222,170,60,.45);opacity:0;transition:opacity 1s,transform 1.4s cubic-bezier(.2,.8,.2,1)}
.photo.on{opacity:1}
.photo .in{position:absolute;left:0;top:0;transform-origin:center;transition:transform 7s linear}
.photo img{position:absolute;display:block;max-width:none}
#ph1{left:90px;width:1100px;height:834px;margin-top:-417px;transform:translateX(-80px)}
#ph1.on{transform:none}
#ph1 .in{width:1100px;height:834px}
#ph1 img{width:1100px;left:0;top:-11px}
#ph2{left:110px;width:800px;height:800px;margin-top:-400px;transform:translateX(-80px)}
#ph2.on{transform:none}
#ph2 .in{width:800px;height:800px}
#ph2 img{width:904px;left:-42px;top:-15px}
.zoom .in{transform:scale(1.1)}
.leg{position:absolute;right:90px;width:560px;top:50%;transform:translateY(-50%) translateX(60px);opacity:0;transition:opacity .9s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.leg.on{opacity:1;transform:translateY(-50%)}
.leg small{display:block;font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:var(--or);margin-bottom:26px}
.leg h2{font:400 84px/1.05 "Young Serif",Georgia,serif}
.leg p{font-size:40px;color:var(--encre2);margin-top:28px;line-height:1.3}
#ph3a,#ph3b{width:520px;height:520px;margin-top:-300px}
#duo{position:absolute;inset:0;opacity:0;transition:opacity 1s}
#duo.on{opacity:1}
#d1,#d2{position:absolute;top:150px;overflow:hidden;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 0 2px rgba(222,170,60,.45)}
#d1{left:340px;width:640px;height:485px}#d1 img{width:640px;position:absolute;top:-6px;left:0}
#d2{left:1020px;width:560px;height:485px}#d2 img{width:642px;position:absolute;left:-30px;top:-10px}
#cta{position:absolute;left:0;right:0;top:700px;text-align:center}
#cta h2{font:400 84px "Young Serif",Georgia,serif}
#cta p{font-size:40px;color:var(--encre2);margin-top:20px}
#cta .btn{display:inline-block;margin-top:40px;padding:22px 64px;border-radius:999px;background:var(--or);color:#1a1322;font-size:38px;font-weight:500}
#barre{position:absolute;left:0;bottom:0;height:6px;background:var(--or);width:0}
</style></head><body>
<div id="ecran"><div id="scene">
 <div class="titre" id="t1"><h1>Argent &amp; Rubis</h1><div class="trait"></div><p>Deux pièces à offrir</p></div>
 <div class="photo" id="ph1"><div class="in"><img src="__BR__" alt="Bracelet"></div></div>
 <div class="leg" id="l1"><small>Argent ciselé</small><h2>Bracelet<br>Empire Romain</h2><p>Une manchette aux motifs floraux gravés.</p></div>
 <div class="photo" id="ph2"><div class="in"><img src="__BG__" alt="Bague"></div></div>
 <div class="leg" id="l2"><small>Rubis &amp; diamants</small><h2>Bague<br>Ruby</h2><p>Un rubis ovale entouré de diamants.</p></div>
 <div id="duo"><div id="d1"><img src="__BR__" alt=""></div><div id="d2"><img src="__BG__" alt=""></div>
  <div id="cta"><h2>Argent &amp; Rubis</h2><p>Bracelet Empire Romain · Bague Ruby</p><span class="btn">Découvrir</span></div></div>
 <div id="barre"></div>
</div></div>
<script>
var D=20000,sc=document.getElementById("scene"),$=function(i){return document.getElementById(i)};
var K=1;function fit(){K=Math.min(innerWidth/1920,innerHeight/1080);sc.style.transform="translate(-50%,-50%) scale("+K+")"}
addEventListener("resize",fit);fit();
function on(i){$(i).classList.add("on")}function off(i){$(i).classList.remove("on")}
var et=[
 [0,function(){on("t1")}],
 [3000,function(){off("t1")}],
 [3800,function(){on("ph1");on("l1");$("ph1").classList.add("zoom")}],
 [9600,function(){off("ph1");off("l1")}],
 [10400,function(){on("ph2");on("l2");$("ph2").classList.add("zoom")}],
 [16000,function(){off("ph2");off("l2")}],
 [16800,function(){on("duo")}]
];
var t0,f;
function loop(){var t=performance.now()-t0;
 while(f<et.length&&t>=et[f][0]){et[f][1]();f++}
 $("barre").style.width=Math.min(t/D,1)*100+"%";
 if(t>=D){restart();return}
 requestAnimationFrame(loop)}
function restart(){["t1","ph1","l1","ph2","l2","duo"].forEach(off);$("ph1").classList.remove("zoom");$("ph2").classList.remove("zoom");
 setTimeout(function(){t0=performance.now();f=0;requestAnimationFrame(loop)},900)}
function start(){t0=performance.now();f=0;requestAnimationFrame(loop)}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(start)}else{start()}
</script></body></html>
